name: Update Eureka Components
description: Resolve component versions from Docker Hub, respecting the template constraint and preRelease filter.

inputs:
  components:
    description: >
      JSON array of component objects taken from the descriptor template, e.g.
      [{"name":"folio-kong","version":"^3.9.1","preRelease":"false"}].
      preRelease is optional and defaults to false; it selects both the tag channel and
      the Docker Hub namespace (false -> folioorg, only -> folioci, true -> both).
    required: true
  docker-username:
    description: Docker Hub username (optional for authenticated lookups)
    required: false
  docker-password:
    description: Docker Hub password (optional for authenticated lookups)
    required: false
  log-level:
    description: Level of logging verbosity (INFO, DEBUG, WARNING, ERROR)
    required: false
    default: 'INFO'

outputs:
  updated-components:
    description: JSON array with updated component versions
    value: "${{ steps.update.outputs.updated-components }}"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-${{ hashFiles(format('{0}/requirements.txt', github.action_path)) }}
        restore-keys: |
          pip-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        IFS=$'\n\t'
        echo 'Installing dependencies...'
        mkdir -p ~/.cache/pip
        python -m pip install --disable-pip-version-check --no-cache-dir -r "${{ github.action_path }}/requirements.txt"

    - id: update
      name: Run update script
      shell: bash
      env:
        DOCKER_USERNAME: '${{ inputs.docker-username }}'
        DOCKER_PASSWORD: '${{ inputs.docker-password }}'
        PYTHONUNBUFFERED: '1'
        LOG_LEVEL: '${{ inputs.log-level }}'
        COMPONENTS_JSON: '${{ inputs.components }}'
      run: |
        set -euo pipefail
        IFS=$'\n\t'
        echo 'Running component update script...'

        # Log to GitHub step summary if available (metadata only; business logic unchanged)
        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          {
            echo '## Update Eureka Components'
            echo "- Log level: $LOG_LEVEL"
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        # Write components to temporary file to avoid command line length issues
        TEMP_JSON_FILE="$(mktemp)"
        printf '%s' "$COMPONENTS_JSON" > "$TEMP_JSON_FILE"

        # Run the script and capture its output
        python "${GITHUB_ACTION_PATH}/update-eureka-components.py" --data "$(cat "$TEMP_JSON_FILE")"
        rm -f "$TEMP_JSON_FILE"

branding:
  icon: refresh-cw
  color: blue